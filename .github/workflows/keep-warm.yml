name: Keep Render services warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

env:
  PROXIED_HEALTH_URL: https://siftvaultj.onrender.com/api/health

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping client + server (via client proxy)
        run: curl -sf "$PROXIED_HEALTH_URL" -o /dev/null
